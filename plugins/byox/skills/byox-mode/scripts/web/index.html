<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>byox</title>
  <script>try { var t = localStorage.getItem("byox.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/vendor/marked.min.js"></script>
</head>
<body>
  <header class="top">
    <a href="#/" class="brand"><span class="mark" aria-hidden="true"></span>byox</a>
    <span id="crumbs"></span>
    <span class="spacer"></span>
    <button id="theme" class="ghost" title="Switch between the system, light and dark theme">Theme</button>
    <button id="fb-open" class="ghost">Feedback</button>
  </header>
  <main id="app"></main>
  <div id="celebrate" hidden></div>
  <dialog id="fb">
    <h2>Feedback on byox</h2>
    <p class="muted">What should change, or what went wrong? The page you are on is saved with it.</p>
    <textarea rows="4" placeholder="The Verify button is hard to find on a phone. Done when it sits right under each step."></textarea>
    <div class="row"><button class="primary" data-save>Save</button><button data-close>Close</button></div>
    <h3>Open items</h3>
    <ul class="fb-list"></ul>
    <div class="row"><button data-ship disabled>Send to a pull request</button></div>
    <div class="fb-changes" hidden>
      <h3>Your own changes</h3>
      <p class="muted"></p>
      <div class="row"><button data-upload>Upload my changes as a pull request</button></div>
    </div>
    <pre class="fb-out" hidden></pre>
  </dialog>
  <script src="/assets/app.js"></script>
</body>
</html>
